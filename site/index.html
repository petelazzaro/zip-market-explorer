<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zip Market Explorer</title>
<meta name="description" content="realtor.com listing-market data for every US zip, county, metro and state, with adjustable trailing averages.">
<meta name="theme-color" content="#0a1324">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0a1324; --surface:#0f1a30; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10); --ink:#eef2fb; --ink2:#b7c1d9; --muted:#7f8bab;
  --gold:#d9b25f; --teal:#2cc5b4;
  --s1:#BA8628; --s2:#139A8A; --s3:#8C7BF5; --ref:#8a93a8;
  --good:#3fbf7f; --warn:#e0a63a; --bad:#e46a6a;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#1a2b52 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#0d3b44 0%,transparent 55%),var(--bg);background-color:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;min-height:100%}
body{overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:"Playfair Display",serif;font-weight:700;font-size:30px;margin:0;letter-spacing:.2px}
h1 span{color:var(--gold)}
h2{font-family:"Playfair Display",serif;font-weight:600;font-size:21px;margin:0 0 4px}
h3{font-size:14px;font-weight:700;margin:0;color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
/* Blur only on the controls bar: blur behind dozens of chart canvases causes repaint glitches and slows scrolling. */
.controls.card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:14px 0 18px;position:relative;z-index:10}
.search{position:relative;flex:1 1 300px;min-width:0}
.search.cmp{flex:1 1 220px}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0}
label.l{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=search],select{width:100%;background:rgba(5,10,22,.6);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;outline:none}
input:focus,select:focus,button:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px rgba(44,197,180,.18);outline:none}
.ctl{flex:0 0 auto}
.ctl input[type=number]{width:90px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink2);padding:10px 12px;font:inherit;cursor:pointer}
.seg button.on{background:rgba(217,178,95,.16);color:var(--gold)}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;padding:10px 0;cursor:pointer}
.ubtn{background:rgba(217,178,95,.14);border:1px solid rgba(217,178,95,.4);color:var(--gold);border-radius:10px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}
.xbtn{background:transparent;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:0 12px;font:inherit;cursor:pointer}
.results{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;background:#101c35;border:1px solid var(--line);border-radius:12px;max-height:360px;overflow:auto;display:none;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.results div{padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.results div.act,.results div:hover{background:rgba(44,197,180,.12)}
.results .t{flex:0 0 52px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--teal)}
.results b{color:var(--gold);font-variant-numeric:tabular-nums;flex:0 0 auto}
.results span.n{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:50px 20px;text-align:center;color:var(--ink2)}
.empty h2{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--glass2);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover{border-color:var(--gold)}
.hdr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:14px}
.geoname{font-family:"Playfair Display",serif;font-size:28px;font-weight:700;overflow-wrap:anywhere}
.geoname small{font-family:"DM Sans";font-size:14px;color:var(--gold);font-weight:500;margin-left:8px;white-space:nowrap}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.badge.w{color:var(--warn);border-color:rgba(224,166,58,.4)}
.badge.c{color:var(--s3);border-color:rgba(140,123,245,.45)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:14px}
@media(max-width:420px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .val{font-size:21px!important}.kpi .row{font-size:11.5px!important}}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .val{font-size:25px;font-weight:700;margin:5px 0 2px;font-variant-numeric:tabular-nums}
.kpi .row{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .dn{color:var(--bad)} .nt{color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.read .verdict{display:flex;align-items:center;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.read .pill{font-weight:700;padding:6px 14px;border-radius:999px;font-size:14px}
.pill.sel{background:rgba(63,191,127,.15);color:var(--good);border:1px solid rgba(63,191,127,.4)}
.pill.buy{background:rgba(228,106,106,.13);color:var(--bad);border:1px solid rgba(228,106,106,.4)}
.pill.bal{background:rgba(224,166,58,.13);color:var(--warn);border:1px solid rgba(224,166,58,.4)}
.read ul{margin:0;padding-left:0;list-style:none}
.read li{padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);display:flex;gap:8px}
.read li .ic{flex:0 0 18px;font-weight:700;text-align:center}
.rank .r{display:grid;grid-template-columns:minmax(110px,140px) 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.rank .bar{height:8px;background:rgba(255,255,255,.07);border-radius:4px;position:relative}
.rank .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s2)}
.rank .r b{text-align:right;font-variant-numeric:tabular-nums}
.rank .big{font-size:34px;font-weight:700;color:var(--gold);margin:14px 0 4px;font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.ch .note{font-size:12px;color:var(--muted);margin:2px 0 8px}
.ch .box{position:relative;height:250px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid}
.sec{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tbl{overflow:auto;max-height:460px;padding:0}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#0f1a30;color:var(--muted);font-weight:500;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;z-index:1}
th.ta{color:var(--teal)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#0f1a30}
th:first-child{z-index:2}
tr.q td:first-child::after{content:" ⚑";color:var(--warn)}
.btn{background:rgba(217,178,95,.14);border:1px solid rgba(217,178,95,.4);color:var(--gold);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.notes{font-size:12.5px;color:var(--muted);line-height:1.6}
.notes p{margin:0 0 8px}
.notes b{color:var(--ink2)}
.loading{color:var(--muted);padding:30px;text-align:center}
.mdh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mdh h2{margin:0}
.lvl{font-size:11px;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:999px;color:var(--teal);border:1px solid rgba(44,197,180,.45);background:rgba(44,197,180,.1)}
.mdn{color:var(--ink);font-weight:700}
.mdnote{font-size:12.5px;color:var(--ink2);margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.mdnote.w{color:var(--warn);border-color:rgba(224,166,58,.35)}
/* Location map. z-index:0 makes its own stacking context so Leaflet's panes stay under the search dropdowns. */
.mapc.card{padding:0;overflow:hidden;margin-bottom:14px;position:relative;z-index:0}
.mapc .mh{display:flex;justify-content:space-between;gap:6px 14px;align-items:baseline;flex-wrap:wrap;padding:12px 16px 10px}
.mapc .mh h2{margin:0}
.mapc .mlg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.mapc .mlg span{display:inline-flex;align-items:center;gap:6px}
.mapc .mlg i{display:inline-block;width:16px;height:10px;border-radius:2px;border:2px solid}
.mapc .mlg i.ctx{border-style:dashed;border-color:var(--ref);background:transparent}
.mapc .mnote{font-size:12.5px;color:var(--warn);padding:0 16px 10px}
.mapc .mstat{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:500;background:rgba(10,19,36,.85);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink2);pointer-events:none}
#map{height:320px;background:#0b1428}
@media(max-width:600px){#map{height:250px}}
.leaflet-container{font:inherit}
.leaflet-container .leaflet-control-attribution{background:rgba(10,19,36,.78);color:var(--muted);font-size:10.5px}
.leaflet-container .leaflet-control-attribution a{color:var(--ink2)}
.leaflet-bar a,.leaflet-bar a:hover{background:#101c35;color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar{border:1px solid var(--line)!important}
.mapc .mhint{font-size:12px;color:var(--muted);padding:7px 16px 9px;border-top:1px solid var(--line)}
.mpick .leaflet-popup-content-wrapper{background:#101c35;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.mpick .leaflet-popup-tip{background:#101c35}
.mpick .leaflet-popup-content{margin:10px 10px 8px;font:inherit;font-size:13px;min-width:220px}
.mpick a.leaflet-popup-close-button{color:var(--muted)}
.mpick .pk-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 22px 6px 4px}
.mpick button.pk{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;color:var(--ink);font:inherit;padding:7px 6px;cursor:pointer}
.mpick button.pk:hover{background:rgba(44,197,180,.12)}
.mpick button.pk.on{cursor:default;opacity:.7}
.mpick .pk-t{flex:0 0 48px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--teal)}
.mpick .pk-n{flex:1;min-width:0}
.mpick .pk-n b{color:var(--gold)}
.mpick .pk-on{font-size:11px;color:var(--gold)}
.mpick .pk-x{font-size:11.5px;color:var(--muted);margin:6px 4px 0}
.leaflet-tooltip.mtip{background:#101c35;border:1px solid var(--line);color:var(--ink);box-shadow:none;font:inherit;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#13223f;border:1px solid var(--teal);padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:50;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Zip <span>Market</span> Explorer</h1>
      <div class="sub" id="cov">realtor.com listing-market data</div>
    </div>
  </div>

  <div class="controls card">
    <div class="search">
      <label class="l" for="q">Search zip, town, county, metro or state</label>
      <div class="srow">
        <input type="search" id="q" placeholder="e.g. 30084, tucker, fulton county, atlanta, GA" autocomplete="off" spellcheck="false">
        <button class="ubtn" id="usbtn" title="United States">US</button>
      </div>
      <div class="results" id="res" role="listbox"></div>
    </div>
    <div class="ctl">
      <label class="l" for="n">Trailing avg (months)</label>
      <input type="number" id="n" min="1" max="24" step="1" value="3" inputmode="numeric">
    </div>
    <div class="ctl">
      <label class="l">Window</label>
      <div class="seg" id="rng"><button data-v="12">12M</button><button data-v="24">24M</button><button data-v="60">5Y</button><button data-v="0" class="on">All</button></div>
    </div>
    <div class="ctl">
      <label class="l" for="bm">Benchmark</label>
      <select id="bm"><option value="parent">Parent state</option><option value="us">US</option><option value="none">None</option></select>
    </div>
    <div class="search cmp">
      <label class="l" for="cq">Compare with (optional)</label>
      <div class="srow">
        <input type="search" id="cq" placeholder="second place to overlay" autocomplete="off" spellcheck="false">
        <button class="xbtn" id="cx" title="Clear comparison" style="display:none">✕</button>
      </div>
      <div class="results" id="cres" role="listbox"></div>
    </div>
    <div class="ctl">
      <label class="chk"><input type="checkbox" id="raw" checked> Show monthly values</label>
    </div>
  </div>

  <div id="main"><div class="card loading">Loading…</div></div>

  <div class="card notes" style="margin-top:22px" id="notes"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const S = {meta:null, shards:{}, geos:{}, cur:null, cmp:null, N:3, win:0, bm:'parent', raw:true, charts:{}, usGeo:null};
const C = {s1:'#BA8628', s2:'#139A8A', s3:'#8C7BF5', ref:'#8a93a8', grid:'rgba(255,255,255,.07)', tick:'#7f8bab'};
const KEYS = ['p','a','f','s','al','nl','pl','tl','dom','prs','pis','pr','q'];
const TYPE = {us:'US', state:'State', metro:'Metro', county:'County', zip:'Zip'};
const $ = id => document.getElementById(id);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mlab = m => MON[(m%100)-1] + ' ' + String(Math.floor(m/100)).slice(2);
const mlong = m => MON[(m%100)-1] + ' ' + Math.floor(m/100);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- data ----------
function decode(d){
  const L = S.meta.months.length, sc = S.meta.scale, out = {};
  for (const k of KEYS){
    if (d[k] === undefined){ out[k] = new Array(L).fill(null); continue; }
    const f = k in sc ? 1/sc[k] : 1;
    out[k] = d[k].split(',').map(v => v === '' ? null : (+v)*f);
  }
  return out;
}
async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(u+' → HTTP '+r.status); return r.json(); }
function shardPath(type, id){
  if (type === 'us') return 'd/us.json';
  if (type === 'state') return 'd/states.json';
  return 'd/'+type+'/'+id.slice(0,2)+'.json';
}
function loadShard(path){
  if (!S.shards[path]) S.shards[path] = getJSON(path).catch(e => { delete S.shards[path]; throw e; });
  return S.shards[path];
}
async function getGeo(type, id){
  const key = type+'-'+id;
  if (S.geos[key]) return S.geos[key];
  const sh = await loadShard(shardPath(type, id));
  const rec = sh[id];
  if (!rec) return null;
  const g = {type, id, key, n:rec.n, st:rec.st || null, rk:rec.rk || null, hr:rec.hr || null, d:decode(rec.d), tc:{}};
  S.geos[key] = g;
  return g;
}
const geoKey = g => g.type === 'us' ? 'us' : g.type+'-'+g.id;
function geoTitle(g){ return g.type === 'us' ? 'United States' : g.n; }
function geoTag(g){ return g.type === 'us' ? 'National' : TYPE[g.type]+' '+g.id; }

// ---------- math ----------
// Trailing average: mean of the non-null values in the last N months; shown only when a full
// N months of history exist and at least half of the window has data.
function trailing(arr, N){
  const need = Math.ceil(N/2), out = new Array(arr.length).fill(null);
  for (let i = N-1; i < arr.length; i++){
    let s = 0, c = 0;
    for (let j = i-N+1; j <= i; j++){ const v = arr[j]; if (v !== null && isFinite(v)){ s += v; c++; } }
    out[i] = c >= need ? s/c : null;
  }
  return out;
}
function T(g, k){
  if (!g) return null;
  const c = g.tc[S.N] || (g.tc[S.N] = {});
  return c[k] || (c[k] = trailing(g.d[k], S.N));
}
function yoy(arr){ return arr.map((v,i) => (i >= 12 && v !== null && arr[i-12]) ? v/arr[i-12]-1 : null); }
function lastIdx(arr){ for (let i = arr.length-1; i >= 0; i--) if (arr[i] !== null) return i; return -1; }
const isNum = v => v !== null && v !== undefined && isFinite(v);

// ---------- formatting ----------
const fmt = {
  usd: v => !isNum(v) ? '–' : v >= 1e6 ? '$'+(v/1e6).toFixed(2)+'M' : v >= 1e3 ? '$'+Math.round(v/1e3)+'K' : '$'+Math.round(v),
  usdFull: v => !isNum(v) ? '–' : '$'+Math.round(v).toLocaleString(),
  psf: v => !isNum(v) ? '–' : '$'+Math.round(v),
  num: v => !isNum(v) ? '–' : Math.round(v).toLocaleString(),
  num1: v => !isNum(v) ? '–' : (Math.round(v*10)/10).toLocaleString(),
  pct: v => !isNum(v) ? '–' : (v*100).toFixed(1)+'%',
  ratio: v => !isNum(v) ? '–' : v.toFixed(2),
  chg: v => !isNum(v) ? '–' : (v >= 0 ? '+' : '')+(v*100).toFixed(1)+'%',
  pts: v => !isNum(v) ? '–' : (v >= 0 ? '+' : '')+(v*100).toFixed(1)+' pts'
};
// dir: +1 = rising favors sellers / tighter market, -1 = falling favors sellers, 0 = neutral
function cls(v, dir){ if (!dir || !isNum(v) || Math.abs(v) < 0.0005) return 'nt'; return (v > 0) === (dir > 0) ? 'up' : 'dn'; }

// ---------- benchmark ----------
function stateGeo(st){ const k = 'state-'+st; return S.geos[k] || null; }
function parentGeo(g){
  if (g.type === 'us') return null;
  if (g.type === 'state') return S.usGeo;
  return (g.st && stateGeo(g.st)) || S.usGeo;
}
function benchGeo(g){
  if (S.bm === 'none') return null;
  if (S.bm === 'us') return g.type === 'us' ? null : S.usGeo;
  return parentGeo(g);
}

// ---------- search ----------
function buildSearch(){
  S.hay = S.meta.idx.map(r => {
    const [type, id, name, st] = r;
    return {type, id, name, st, lid:id.toLowerCase(), lname:name.toLowerCase(),
      h:(id+' '+name+' '+TYPE[type]+(type === 'county' ? ' county parish borough' : '')+(type === 'metro' ? ' metro msa cbsa' : '')+(type === 'us' ? ' united states usa national' : '')+' '+st).toLowerCase()};
  });
}
function search(qRaw){
  const q = qRaw.trim().toLowerCase().replace(/\s+/g,' ');
  if (!q || !S.hay) return [];
  const terms = q.split(/[\s,]+/).filter(Boolean);
  const ex = [], st = [], ot = [];
  for (const r of S.hay){
    if (!terms.every(t => r.h.includes(t))) continue;
    if (r.lid === q || r.lname === q) ex.push(r);
    else if (r.lid.startsWith(q) || r.lname.startsWith(q)) st.push(r);
    else if (ot.length < 80) ot.push(r);
    if (ex.length + st.length >= 60) break;
  }
  return ex.concat(st, ot).slice(0, 40);
}
function attachSearch(inp, box, onPick){
  let hits = [], act = -1;
  const draw = () => {
    box.innerHTML = hits.length ? hits.map((h,i) => '<div role="option" data-i="'+i+'" class="'+(i === act ? 'act' : '')+'"><span class="t">'+TYPE[h.type]+'</span><b>'+esc(h.type === 'us' ? 'US' : h.id)+'</b><span class="n">'+esc(h.name)+'</span></div>').join('')
      : '<div style="cursor:default"><span class="n">No matches</span></div>';
    box.style.display = 'block';
  };
  const run = () => { hits = search(inp.value); act = hits.length ? 0 : -1; if (!inp.value.trim()) { box.style.display = 'none'; return; } draw(); };
  const pick = i => { const h = hits[i]; if (!h) return; box.style.display = 'none'; inp.blur(); onPick(h.type, h.id); };
  inp.addEventListener('input', run);
  inp.addEventListener('focus', () => { if (inp.value.trim() && !inp.dataset.sel) run(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ box.style.display = 'none'; return; }
    if (box.style.display !== 'block') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      act = Math.max(0, Math.min(hits.length-1, act + (e.key === 'ArrowDown' ? 1 : -1)));
      [...box.children].forEach((c,i) => c.classList.toggle('act', i === act));
      box.children[act] && box.children[act].scrollIntoView({block:'nearest'});
    } else if (e.key === 'Enter'){ e.preventDefault(); if (hits.length) pick(act < 0 ? 0 : act); }
  });
  inp.addEventListener('input', () => { delete inp.dataset.sel; });
  box.addEventListener('mousedown', e => { const t = e.target.closest('[data-i]'); if (t){ e.preventDefault(); pick(+t.dataset.i); } });
  document.addEventListener('click', e => { if (!box.contains(e.target) && e.target !== inp) box.style.display = 'none'; });
}
function setInput(inp, g){ inp.value = g ? (g.type === 'us' ? 'United States' : g.n+' · '+TYPE[g.type]+' '+g.id) : ''; if (g) inp.dataset.sel = '1'; }

function parseKey(s){
  if (!s) return null;

  const m = s.match(/^(zip|county|metro|state)-([A-Za-z0-9]+)$/);
  return m ? [m[1], m[1] === 'state' ? m[2].toUpperCase() : m[2]] : null;
}
function parseHash(){
  const h = decodeURIComponent((location.hash || '').slice(1));

}

// ---------- location map ----------
// Outlines come from the Census TIGERweb service at view time (GeoJSON, simplified server-side),
// so no boundary files live in the repo. Basemap tiles: Esri dark gray canvas.
const TIGER = 'https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/';
const US48 = [[24.4,-125.0],[49.5,-66.9]];
const bndP = {};
function bndQueries(type, id){
  if (!/^[0-9A-Za-z]+$/.test(id)) return [];
  const eq = "GEOID='"+id+"'";
  if (type === 'zip') return [[2, eq, 0.0002]];          // 2020 ZCTAs
  if (type === 'county') return [[82, eq, 0.0005]];
  if (type === 'metro') return [[93, eq, 0.002], [91, eq, 0.002]];   // metropolitan, then micropolitan
  if (type === 'state') return [[80, "STUSAB='"+id+"'", 0.005]];
  return [];
}
async function fetchBoundary(type, id){
  for (const [layer, where, simp] of bndQueries(type, id)){
    const u = TIGER+layer+'/query?'+new URLSearchParams({where, outFields:'GEOID', outSR:'4326', maxAllowableOffset:simp, geometryPrecision:'5', f:'geojson'});
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(u, {signal:ctl.signal});
      if (!r.ok) throw new Error('Census map service: HTTP '+r.status);
      const j = await r.json();
      if (j.error) throw new Error('Census map service: '+(j.error.message || 'error'));
      if (j.features && j.features.length) return j;
    } catch(e){ throw e.name === 'AbortError' ? new Error('the Census map service timed out') : e; }
    finally { clearTimeout(t); }
  }
  return null;   // no outline for this geography (e.g. a PO-box zip)
}
function getBoundary(type, id){
  const k = type+'-'+id;
  return bndP[k] || (bndP[k] = fetchBoundary(type, id).catch(e => { delete bndP[k]; throw e; }));
}
// What to draw: the main outline, a dashed context outline around it, and an optional fallback.
async function mapPlan(g){
  const plan = {main:null, ctx:null, note:null, ctxLabel:null};
  if (g.type === 'us') return plan;
  const stName = st => { const s = stateGeo(st); return s ? s.n : st; };
  plan.main = await getBoundary(g.type, g.id);
  if (g.type === 'zip'){
    let fips = null;
    try { const z = await loadZ2C(); fips = z[g.id] ? z[g.id][0] : null; } catch(e){}
    if (fips){ plan.ctx = await getBoundary('county', fips).catch(() => null); plan.ctxLabel = countyLabel(fips, S.cfpb && S.cfpb.counties[fips]); }
    else if (g.st){ plan.ctx = await getBoundary('state', g.st).catch(() => null); plan.ctxLabel = stName(g.st); }
    if (!plan.main) plan.note = 'Zip '+g.id+' has no mapped area in the Census zip-area (ZCTA) file — usually a PO-box or single-building zip. Showing '+(plan.ctxLabel || 'its state')+' instead.';
  } else if ((g.type === 'county' || g.type === 'metro') && g.st){
    plan.ctx = await getBoundary('state', g.st).catch(() => null); plan.ctxLabel = stName(g.st);
    if (!plan.main) plan.note = 'Census has no outline for '+TYPE[g.type].toLowerCase()+' '+g.id+'. Showing '+plan.ctxLabel+' instead.';
  } else if (!plan.main) plan.note = 'Census has no outline for '+geoTitle(g)+'.';
  return plan;
}
function mapKey(){ return geoKey(S.cur)+'|'+(S.cmp ? geoKey(S.cmp) : ''); }
function idxRow(type, id){
  if (!S.idxMap){ S.idxMap = new Map(); S.meta.idx.forEach(r => S.idxMap.set(r[0]+'-'+r[1], r)); }
  return S.idxMap.get(type+'-'+id) || null;
}
async function tigerQuery(layer, params){
  const u = TIGER+layer+'/query?'+new URLSearchParams(Object.assign({inSR:'4326', spatialRel:'esriSpatialRelIntersects'}, params));
  const r = await fetch(u); if (!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json(); if (j.error) throw new Error(j.error.message || 'error');
  return j;
}
// Everything at a clicked point that exists in our data: zip, county, metro, state.
async function placesAt(ll){
  const pt = {geometry:ll.lng.toFixed(5)+','+ll.lat.toFixed(5), geometryType:'esriGeometryPoint', returnGeometry:'false', f:'json'};
  const q = (layer, fields) => tigerQuery(layer, Object.assign({outFields:fields}, pt)).then(j => j.features.map(f => f.attributes)).catch(() => []);
  const [z, c, m1, m2, s] = await Promise.all([q(2,'GEOID'), q(82,'GEOID'), q(93,'GEOID'), q(91,'GEOID'), q(80,'STUSAB')]);
  const out = [];
  const add = (type, id) => { const r = idxRow(type, id); if (r) out.push({type, id, name:r[2]}); };
  z.forEach(a => add('zip', a.GEOID)); c.forEach(a => add('county', a.GEOID));
  m1.concat(m2).forEach(a => add('metro', a.GEOID)); s.forEach(a => add('state', a.STUSAB));
  return {out, missingZip: z.length ? null : true, rawZip: z.length ? z[0].GEOID : null};
}
async function pickAt(map, ll){
  const pop = L.popup({className:'mpick', maxWidth:300, autoPanPadding:[20,20]}).setLatLng(ll).setContent('<div class="pk-h">Looking up this spot…</div>').openOn(map);
  let res;
  try { res = await placesAt(ll); } catch(e){ pop.setContent('<div class="pk-h">Lookup failed — try again.</div>'); return; }
  if (!map.hasLayer(pop)) return;
  if (!res.out.length){ pop.setContent('<div class="pk-h">No realtor.com data for this spot.</div>'); return; }
  const cur = S.cur ? geoKey(S.cur) : '';
  let h = '<div class="pk-h">Open this area</div>';
  res.out.forEach(p => {
    const on = cur === p.type+'-'+p.id;
    h += '<button class="pk'+(on ? ' on' : '')+'" data-t="'+p.type+'" data-id="'+esc(p.id)+'"><span class="pk-t">'+TYPE[p.type]+'</span><span class="pk-n">'+
      (p.type === 'zip' ? '<b>'+esc(p.id)+'</b> ' : '')+esc(p.name)+'</span>'+(on ? '<span class="pk-on">showing</span>' : '')+'</button>';
  });
  if (res.missingZip) h += '<div class="pk-x">No zip area here (water, parkland or a PO-box-only area).</div>';
  else if (res.rawZip && !idxRow('zip', res.rawZip)) h += '<div class="pk-x">Zip '+esc(res.rawZip)+' has no realtor.com data.</div>';
  pop.setContent(h);
  pop.getElement().querySelectorAll('button.pk').forEach(b => b.onclick = () => {
    map.closePopup(pop);
    if (b.classList.contains('on')) return;
    select(b.dataset.t, b.dataset.id);
  });
}
// Faint outlines of every zip in view once zoomed in, so you can see where one ends and the next begins.
const ZIP_MIN_ZOOM = 10.5;
function attachZipLayer(map, card){
  const renderer = L.canvas({padding:0.3});
  let layer = null, seq = 0, timer = null;
  const hint = card.querySelector('.mhint');
  const setHint = () => { hint.textContent = map.getZoom() >= ZIP_MIN_ZOOM ? 'Click any spot to open its zip, county, metro or state' : 'Zoom in to see zip outlines · click any spot to open it'; };
  const refresh = async () => {
    setHint();
    const my = ++seq;
    if (map.getZoom() < ZIP_MIN_ZOOM){ if (layer){ map.removeLayer(layer); layer = null; } return; }
    const b = map.getBounds();
    let gj;
    try {
      gj = await tigerQuery(2, {geometry:[b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(v => v.toFixed(4)).join(','),
        geometryType:'esriGeometryEnvelope', outFields:'GEOID', outSR:'4326', maxAllowableOffset:map.getZoom() >= 12.5 ? '0.0002' : '0.0006', geometryPrecision:'5', f:'geojson'});
    } catch(e){ return; }
    if (my !== seq || !S.mapCard || S.mapCard.map !== map) return;
    if (layer) map.removeLayer(layer);
    const base = {color:'#2cc5b4', weight:1, opacity:0.55, fill:true, fillOpacity:0.02, fillColor:'#2cc5b4'};
    layer = L.geoJSON(gj, {pane:'zips', renderer, style:() => base,
      onEachFeature:(f, l) => {
        const id = f.properties.GEOID, r = idxRow('zip', id);
        l.bindTooltip('<b>'+esc(id)+'</b> '+(r ? esc(r[2]) : '<span style="color:#7f8bab">no data</span>'), {sticky:true, className:'mtip'});
        l.on('mouseover', () => l.setStyle({weight:2, opacity:1, fillOpacity:0.12}));
        l.on('mouseout', () => l.setStyle(base));
      }}).addTo(map);
  };
  map.createPane('zips'); map.getPane('zips').style.zIndex = 390;
  map.on('moveend', () => { clearTimeout(timer); timer = setTimeout(refresh, 300); });
  setHint();
}
async function renderMap(g){
  const box = $('mapbox'); if (!box) return;
  // Re-renders (trailing window, benchmark) keep the existing map, so pan/zoom isn't reset.
  if (S.mapCard && S.mapCard.key === mapKey()){ box.replaceWith(S.mapCard.el); S.mapCard.map.invalidateSize(); return; }
  if (S.mapCard){ try { S.mapCard.map.remove(); } catch(e){} S.mapCard = null; }
  const card = document.createElement('div');
  card.className = 'card mapc';
  if (typeof L === 'undefined'){
    card.innerHTML = '<div class="mh"><h2>Location</h2></div><div class="mnote">The map library didn\'t load — check your connection and reload.</div>';
    box.replaceWith(card); return;
  }
  const cmp = S.cmp;
  card.innerHTML = '<div class="mh"><h2>Location</h2><div class="mlg">'+
    (g.type === 'us' ? '' : '<span><i style="border-color:'+C.s1+';background:rgba(186,134,40,.25)"></i>'+esc(geoTitle(g))+'</span>')+
    '<span class="ctxl" style="display:none"><i class="ctx"></i><b style="font-weight:400"></b></span>'+
    (cmp && cmp.type !== 'us' ? '<span><i style="border-color:'+C.s3+';background:rgba(140,123,245,.2)"></i>'+esc(geoTitle(cmp))+'</span>' : '')+
    '</div></div><div class="mnote" style="display:none"></div><div id="map"></div><div class="mhint"></div><div class="mstat">Loading outline…</div>';
  box.replaceWith(card);
  const map = L.map(card.querySelector('#map'), {scrollWheelZoom:false, zoomSnap:0.25, worldCopyJump:true});
  // Esri dark gray canvas (no API key): base below the outlines, place/road labels on a pane above them.
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  L.tileLayer(ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom:16,
    attribution:'Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors · Boundaries: US Census'}).addTo(map);
  map.createPane('labels'); map.getPane('labels').style.zIndex = 450; map.getPane('labels').style.pointerEvents = 'none';
  L.tileLayer(ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom:16, pane:'labels'}).addTo(map);
  map.fitBounds(US48);
  // Scroll-wheel zoom only after the map is clicked, so scrolling the page never gets trapped.
  // A click also looks up what's at that spot and offers to open it.
  map.on('click', e => { map.scrollWheelZoom.enable(); pickAt(map, e.latlng); });
  map.on('mouseout', () => map.scrollWheelZoom.disable());
  S.mapCard = {key:mapKey(), el:card, map};
  attachZipLayer(map, card);
  const stat = card.querySelector('.mstat'), mine = () => S.mapCard && S.mapCard.map === map;
  let plan, cmpB = null;
  try {
    [plan, cmpB] = await Promise.all([mapPlan(g), cmp && cmp.type !== 'us' ? getBoundary(cmp.type, cmp.id).catch(() => null) : null]);
  } catch(e){
    if (mine()){ stat.textContent = 'Could not load the outline ('+e.message+').'; S.mapCard.key = null; }
    return;
  }
  if (!mine()) return;
  stat.remove();
  const draw = (gj, style, tip) => {
    const l = L.geoJSON(gj, {style, interactive:!!tip});
    if (tip) l.bindTooltip(esc(tip), {sticky:true, className:'mtip'});
    return l.addTo(map);
  };
  let ctxL = null, mainL = null;
  if (plan.ctx){
    ctxL = draw(plan.ctx, {color:C.ref, weight:1.5, dashArray:'6 5', fill:false}, null);
    const cl = card.querySelector('.ctxl'); cl.style.display = ''; cl.querySelector('b').textContent = plan.ctxLabel;
  }
  if (cmpB) draw(cmpB, {color:C.s3, weight:2, fillColor:C.s3, fillOpacity:0.15}, geoTitle(cmp));
  if (plan.main){ mainL = draw(plan.main, {color:'#d9b25f', weight:2.5, fillColor:C.s1, fillOpacity:0.22}, geoTitle(g)); mainL.bringToFront(); }
  if (plan.note){ const n = card.querySelector('.mnote'); n.textContent = plan.note; n.style.display = ''; }
  const target = mainL || ctxL;
  if (target) map.fitBounds(target.getBounds(), {padding:[22,22], maxZoom:14});
  else if (g.type === 'us') map.fitBounds(US48);
}

// ---------- mortgage distress (CFPB) ----------
let cfpbP = null, z2cP = null;
function loadCFPB(){ return cfpbP || (cfpbP = getJSON('d/cfpb_delinquency.json').catch(e => { cfpbP = null; throw e; })); }
function loadZ2C(){ return z2cP || (z2cP = getJSON('d/zip_to_county.json').catch(e => { z2cP = null; throw e; })); }
function cfpbArr(rec, k){
  if (!rec || !rec[k]) return null;
  const key = '_'+k;
  if (!rec[key]){ const sc = S.cfpb.scale; rec[key] = rec[k].split(',').map(v => v === '' ? null : (+v)/sc); }
  return rec[key];
}
function countyLabel(fips, cf){
  if (cf) return cf.n+', '+cf.st;
  const r = S.meta.idx.find(x => x[0] === 'county' && x[1] === fips);
  return r ? r[2] : 'County '+fips;
}
// Decide which CFPB series to show for a geography, plus its comparison lines.
function distressContext(g, z2c){
  const C_ = S.cfpb, us = {key:'us', name:'United States', rec:C_.us};
  const stRec = st => st && C_.states[st] ? {key:'st-'+st, name:C_.states[st].n, rec:C_.states[st]} : null;
  if (g.type === 'us') return {level:'NATIONAL', main:us, comps:[]};
  if (g.type === 'state'){ const s = stRec(g.id); return s ? {level:'STATE-LEVEL', main:s, comps:[us]} : null; }
  const st = stRec(g.st);
  const fallback = reason => st ? {level:'STATE-LEVEL', main:st, comps:[us], fallback:reason} : null;
  if (g.type === 'metro') return fallback('CFPB county data doesn\'t map cleanly onto a metro, so this shows '+(st ? st.name : 'the state')+'. Open one of its counties or zips for county-level detail.');
  let fips = null, note = null;
  if (g.type === 'county') fips = g.id;
  if (g.type === 'zip'){
    const m = z2c && z2c[g.id];
    if (!m) return fallback('Zip '+g.id+' isn\'t in the Census 2020 zip-area (ZCTA) list — often a PO-box or single-building zip — so it can\'t be matched to a county.');
    fips = m[0];
    if (m[2] > 1) note = 'Zip '+g.id+' spans '+m[2]+' counties; '+countyLabel(fips, C_.counties[fips])+' holds '+m[1]+'% of its land area and is used here.';
  }
  const cf = C_.counties[fips];
  if (!cf){
    if (fips.startsWith('09')) return fallback('Connecticut replaced its counties with planning regions in 2022; the Census zip-to-county file still uses the old counties, so CFPB\'s Connecticut series can\'t be matched to a zip yet.');
    return fallback('CFPB doesn\'t publish '+countyLabel(fips, null)+' (it only reports counties with at least 1,000 mortgages in its sample).');
  }
  return {level:'COUNTY-LEVEL', main:{key:'co-'+fips, name:countyLabel(fips, cf), rec:cf}, comps:[st, us].filter(Boolean), note};
}

function marketRead(g, pg){
  const li = S.meta.months.length-1, items = [];
  const B = k => pg ? T(pg,k)[li] : null;
  const add = (s, t) => items.push({s, t});
  const bl = pg ? esc(geoTitle(pg)) : '';
  const dom = T(g,'dom')[li], bdom = B('dom');
  if (isNum(dom) && bdom){ const r = dom/bdom; add(r < 0.85 ? 1 : r > 1.15 ? -1 : 0, 'Days on market '+Math.round(dom)+' vs '+Math.round(bdom)+' for '+bl+' ('+r.toFixed(2)+'×, '+(r < 1 ? Math.round((1-r)*100)+'% faster' : Math.round((r-1)*100)+'% slower')+').'); }
  const prs = T(g,'prs')[li], bprs = B('prs');
  if (isNum(prs) && isNum(bprs)){ const df = prs-bprs; add(df < -0.03 ? 1 : df > 0.03 ? -1 : 0, 'Price-reduced share '+fmt.pct(prs)+' vs '+fmt.pct(bprs)+' for '+bl+' ('+fmt.pts(df)+').'); }
  const pr = T(g,'pr')[li], bpr = B('pr');
  if (isNum(pr) && bpr){ const r = pr/bpr; add(r > 1.15 ? 1 : r < 0.85 ? -1 : 0, 'Pending ratio '+pr.toFixed(2)+' vs '+bpr.toFixed(2)+' for '+bl+' ('+r.toFixed(2)+'×).'); }
  const al = T(g,'al')[li], al0 = T(g,'al')[li-12];
  if (isNum(al) && al0){ const c = al/al0-1; add(c < -0.05 ? 1 : c > 0.15 ? -1 : 0, 'Active inventory '+fmt.chg(c)+' YoY ('+fmt.num1(al0)+' → '+fmt.num1(al)+' avg listings).'); }
  const d0 = T(g,'dom')[li-12];
  if (isNum(dom) && d0){ const c = dom/d0-1; add(c < -0.10 ? 1 : c > 0.10 ? -1 : 0, 'Days on market '+fmt.chg(c)+' YoY ('+Math.round(d0)+' → '+Math.round(dom)+' days).'); }
  const f = T(g,'f')[li], f0 = T(g,'f')[li-12];
  if (isNum(f) && f0){ const c = f/f0-1; add(c > 0.03 ? 1 : c < -0.02 ? -1 : 0, 'Price per sq ft '+fmt.chg(c)+' YoY ($'+Math.round(f0)+' → $'+Math.round(f)+').'); }
  const score = items.reduce((a,b) => a+b.s, 0), max = items.length;
  let label = 'Balanced', c = 'bal';
  if (!max) label = 'Not enough data';
  else if (score >= 2){ label = 'Seller-leaning'; c = 'sel'; }
  else if (score <= -2){ label = 'Buyer-leaning'; c = 'buy'; }
  if (!pg && max) items.push({s:0, t:'No benchmark above the national level, so only the three year-over-year signals apply.'});
  return {label, cls:c, score, max, items};
}

function windowStart(){ const L = S.meta.months.length; return S.win ? Math.max(0, L - S.win) : 0; }
function sl(a){ return a ? a.slice(windowStart()) : a; }

function baseOpts(yfmt, yMin0){
  return {
    responsive:true, maintainAspectRatio:false, animation:false, spanGaps:true,
    interaction:{mode:'index', intersect:false},
    plugins:{ legend:{display:false},
      tooltip:{backgroundColor:'#0b1529', borderColor:'rgba(255,255,255,.15)', borderWidth:1, titleColor:'#eef2fb', bodyColor:'#b7c1d9', padding:10,
        callbacks:{label: c => ' '+c.dataset.label+': '+(c.parsed.y === null ? '–' : yfmt(c.parsed.y))},
        filter: c => c.parsed.y !== null }},
    scales:{
      x:{grid:{display:false}, ticks:{color:C.tick, maxRotation:0, autoSkip:true, maxTicksLimit:8}, border:{color:'rgba(255,255,255,.15)'}},
      y:{beginAtZero:!!yMin0, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.tick, callback:v => yfmt(v), maxTicksLimit:6}}

function rawDS(label, data, color, flags){
  const D = sl(data), F = flags ? sl(flags) : null, r = D.length > 60 ? 1.8 : 2.6;
  return {label:label+' (monthly)', data:D, borderColor:color+'88', backgroundColor:color, borderWidth:1.25, tension:0,
    pointRadius:D.map(v => v === null ? 0 : r), pointHoverRadius:5, pointBorderColor:color, pointBorderWidth:1.2,
    pointBackgroundColor:F ? F.map(q => q === 1 ? 'rgba(0,0,0,0)' : color) : color};
}
function lineDS(label, data, color, w){ return {label, data:sl(data), borderColor:color, backgroundColor:color, borderWidth:w || 2.75, pointRadius:0, pointHoverRadius:5, tension:.25}; }
function refDS(label, data){ return {label, data:sl(data), borderColor:C.ref, backgroundColor:C.ref, borderWidth:1.5, borderDash:[6,4], pointRadius:0, pointHoverRadius:4, tension:.25}; }
function legendHTML(items){ return items.map(([c,l,dash]) => '<span><i style="border-top-color:'+c+';'+(dash ? 'border-top-style:dashed' : '')+'"></i>'+esc(l)+'</span>').join(''); }

// Bridge short gaps (1–2 missing months) but break the line across longer ones, so sparse
// places never show an invented straight line over years with no data.
const MAX_BRIDGE = 2;
function gapSegment(data){
  const long = new Array(data.length).fill(false);
  for (let i = 0; i < data.length; ){
    if (data[i] !== null){ i++; continue; }
    let j = i; while (j < data.length && data[j] === null) j++;
    if (j - i > MAX_BRIDGE) for (let k = i; k < j; k++) long[k] = true;
    i = j;
  }
  return {borderColor: ctx => (long[ctx.p0DataIndex] || long[ctx.p1DataIndex]) ? 'rgba(0,0,0,0)' : undefined};
}
function mk(id, datasets, yfmt, yMin0, legend, extra, labels){
  if (S.charts[id]) S.charts[id].destroy();
  datasets.forEach(ds => { if (!ds.segment) ds.segment = gapSegment(ds.data); });
  const o = baseOpts(yfmt, yMin0); if (extra) extra(o);
  S.charts[id] = new Chart($(id), {type:'line', data:{labels:labels || sl(S.meta.months).map(mlab), datasets}, options:o});
  if (legend) $('lg_'+id).innerHTML = legendHTML(legend);
}

function seasonal(id, arr, f){
  const M = S.meta.months, byYear = {};
  M.forEach((m,i) => { const y = Math.floor(m/100); (byYear[y] = byYear[y] || new Array(12).fill(null))[(m%100)-1] = arr[i]; });
  const years = Object.keys(byYear).map(Number).sort((a,b) => a-b).filter(y => byYear[y].some(v => v !== null));
  const n = years.length, ds = [];
  years.forEach((y,i) => {
    const last = i === n-1, prev = i === n-2;
    const a = n > 2 ? 0.18 + 0.5*(i/(n-3 || 1)) : 0.6;
    const color = last ? C.s1 : prev ? C.s2 : 'rgba(138,147,168,'+Math.min(a, 0.68).toFixed(2)+')';
    ds.push({label:String(y), data:byYear[y], borderColor:color, backgroundColor:color, borderWidth:last ? 3 : prev ? 2.25 : 1.25,
      pointRadius:last ? 2.5 : 0, pointHoverRadius:4, tension:.25, order:last ? 0 : prev ? 1 : 2});
  });
  const lg = [];
  if (n) lg.push([C.s1, String(years[n-1])]);
  if (n > 1) lg.push([C.s2, String(years[n-2])]);
  if (n > 2) lg.push(['rgba(138,147,168,.6)', years[0]+'–'+years[n-3]+' (lighter = earlier)']);
  mk(id, ds.reverse(), f, false, lg, o => { o.plugins.tooltip.itemSort = (a,b) => (+b.dataset.label) - (+a.dataset.label); }, MON);
}

  for (let i = 0; i < M.length; i++){
    if (COLS.every(([k]) => d[k][i] === null)) continue;
    lines.push([M[i], g.type, g.type === 'us' ? 'US' : g.id, csvCell(geoTitle(g))].concat(
      COLS.map(([k]) => d[k][i] === null ? '' : +d[k][i].toFixed(4)),
      TACOLS.map(([k]) => { const v = T(g,k)[i]; return v === null ? '' : +v.toFixed(4); }),
      [d.q[i] === null ? '' : d.q[i]]).join(','));
  }
  const txt = lines.join('\n');
  const ok = () => toast('Copied '+(lines.length-1)+' rows — paste into Excel');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? ok() : toast('Copy blocked by browser'); } catch(e){ toast('Copy blocked by browser'); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch(e){ fallback(); }
}
function toast(t){ const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2600); }

// ---------- notes ----------
function renderNotes(){
  const M = S.meta.months;
  $('notes').innerHTML =
   '<p><b>Version v03.</b> <b>About the data.</b> Source: realtor.com Inventory Core Metrics (monthly History files), '+mlong(M[0])+' – '+mlong(M[M.length-1])+', built '+esc(S.meta.built.slice(0,10))+'. '+
   'These are <b>listing</b> metrics — asking prices, active inventory, pending contracts — not closed sales.</p>'+
   '<p><b>Trailing average rule.</b> Each point is the mean of the non-null monthly values in the last N months. A point is shown only if (a) N months of history exist and (b) at least half of the window (N÷2, rounded up) has data — so long windows start later and sparse places can have gaps.</p>'+
   '<p><b>Benchmarks</b> are the actual realtor.com figures for the parent geography — the state for a zip, county or metro (a multi-state metro uses its first-listed state), and the US for a state — smoothed with the same trailing window. They are not medians of zips.</p>'+
   '<p><b>Market read</b> scores six signals with N-month trailing averages: days on market, price-reduced share and pending ratio vs the parent geography; active inventory, days on market and $/sq ft vs a year ago. Total of +2 or more = seller-leaning, −2 or less = buyer-leaning, otherwise balanced.</p>'+
   '<p><b>Colors on tiles</b>: green = the change points to a tighter / stronger market for sellers, red = softer. Shares change in percentage points. Median sq ft is not colored.</p>'+
   '<p><b>Percentile ranks</b> compare a zip or county with the others in its state for the latest month (100 = highest value, not necessarily "best"). For zips without a name in the source, the state is inferred from the first three digits.</p>'+
   '<p><b>Mortgage Distress</b> shows the share of mortgages 30–89 days and 90+ days delinquent, from the CFPB Mortgage Performance Trends data (National Mortgage Database). It is <b>county-level</b>, not zip-level: each zip uses the county holding the largest share of its land area (Census 2020 zip-area-to-county file). CFPB only publishes counties with at least 1,000 sampled mortgages; elsewhere the panel says so and shows the state series. CFPB data are published with a lag of several months.</p>'+
   '<p><b>Location map</b> outlines come from the US Census TIGERweb service: 2020 zip-code tabulation areas (ZCTAs) for zips, and current county, metro/micro area and state boundaries. ZCTAs approximate USPS zips; PO-box and single-building zips have no area, so the map shows the surrounding county or state. The dashed outline is context — a zip\'s main county, or the state of a county or metro. Zoom in and every zip in view is outlined in teal; click any spot to open the zip, county, metro or state there. After a click, the scroll wheel zooms the map. Basemap © Esri, HERE, Garmin, © OpenStreetMap contributors.</p>'+
   '<p><b>⚑ / hollow points</b> mark months realtor.com flagged with quality_flag = 1 — read those with caution. <b>Thin market</b> means fewer than 10 active listings on the trailing average; lean on the trailing average there.</p>';
}

// ---------- wiring ----------
attachSearch($('q'), $('res'), (t,id) => select(t,id));
attachSearch($('cq'), $('cres'), (t,id) => selectCmp(t,id));
$('usbtn').addEventListener('click', () => select('us','us'));
$('cx').addEventListener('click', () => selectCmp(null));
$('cq').addEventListener('input', () => { if (!$('cq').value.trim() && S.cmp) selectCmp(null); });
$('n').addEventListener('input', () => { const v = Math.round(+$('n').value); if (v >= 1 && v <= 24 && v !== S.N){ S.N = v; if (S.cur) render(); } });
$('n').addEventListener('blur', () => { $('n').value = S.N; });
$('rng').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.win = +b.dataset.v;
  [...$('rng').children].forEach(x => x.classList.toggle('on', x === b)); if (S.cur) drawCharts(S.cur, benchGeo(S.cur)); });
$('bm').addEventListener('change', () => { S.bm = $('bm').value; if (S.cur) render(); });
$('raw').addEventListener('change', () => { S.raw = $('raw').checked; if (S.cur) drawCharts(S.cur, benchGeo(S.cur)); });

async function openFromHash(){
  const {a, b} = parseHash();
  S.cmp = null;
  if (b){ try { S.cmp = await getGeo(b[0], b[1]); } catch(e){ S.cmp = null; } }
  setInput($('cq'), S.cmp); $('cx').style.display = S.cmp ? '' : 'none';
  if (a) { await select(a[0], a[1]); window.scrollTo(0, 0); return true; }
  return false;
}
function emptyState(){
  const picks = [['zip','30084'],['county','13121'],['metro','12060'],['state','GA'],['us','us']];
  let h = '<div class="card empty"><h2>Pick a place to start</h2><div>Search a zip, town, county, metro or state — or tap the US button. Every chart shows monthly values plus your trailing average.</div><div class="chips">';
  picks.forEach(([t,id]) => { const r = S.meta.idx.find(x => x[0] === t && x[1] === id); if (r) h += '<button class="chip" data-t="'+t+'" data-id="'+id+'">'+TYPE[t]+' · '+esc(r[2])+'</button>'; });
  $('main').innerHTML = h+'</div></div>';
  $('main').querySelectorAll('.chip').forEach(b => b.onclick = () => select(b.dataset.t, b.dataset.id));
}

(async function init(){
  if (typeof Chart === 'undefined'){ $('main').innerHTML = '<div class="card empty"><h2>Could not load the chart library</h2><div>Check your connection and reload.</div></div>'; return; }
  Chart.defaults.font.family = '"DM Sans", system-ui, sans-serif';
  Chart.defaults.color = C.tick;
  try {
    S.meta = await getJSON('d/meta.json');
    const st = await loadShard('d/states.json');
    await Promise.all(Object.keys(st).map(k => getGeo('state', k)));
    if (S.meta.hasUS) S.usGeo = await getGeo('us','us');
  } catch(e){ $('main').innerHTML = '<div class="card empty"><h2>Could not load data files</h2><div>'+esc(e.message)+'</div></div>'; return; }
  const M = S.meta.months;
  S.counts = {}; S.meta.idx.forEach(r => S.counts[r[0]] = (S.counts[r[0]] || 0)+1);
  $('cov').textContent = 'realtor.com listing data · '+(S.counts.zip || 0).toLocaleString()+' zips · '+(S.counts.county || 0).toLocaleString()+' counties · '+(S.counts.metro || 0).toLocaleString()+' metros · '+mlong(M[0])+' – '+mlong(M[M.length-1]);
  buildSearch(); renderNotes();
  if (!(await openFromHash())) emptyState();
})();
window.addEventListener('hashchange', async () => {
  const {a, b} = parseHash();
  const same = (g, k) => g && k && g.type === k[0] && g.id === k[1];
  if (a && (!same(S.cur, a) || !!b !== !!S.cmp || (b && !same(S.cmp, b)))) openFromHash();
});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
